services:
  - type: web
    name: shogatsu-pedidos
    runtime: node
    plan: free
    buildCommand: echo "Sem dependências externas, nada para instalar"
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
    autoDeploy: true
    # Opcional, mas recomendado (veja README.md > "Persistência de dados no Render"):
    #   SUPABASE_URL = URL do seu projeto Supabase
    #   SUPABASE_SERVICE_KEY = service_role key do Supabase
    #   GEMINI_API_KEY = se for usar respostas de IA no atendimento
