services:
  - type: web
    name: sabor-e-brasa-cardapio
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
    autoDeploy: true
    # ATENÇÃO: o plano free do Render tem disco efêmero — server/data/menu.json
    # volta ao estado do último deploy (do repositório) sempre que o serviço reinicia
    # ou é atualizado. Para persistir de verdade as edições feitas pelo Admin,
    # adicione um "Persistent Disk" no Render (pago) montado em /opt/render/project/src/server/data
    # ou migre para um banco de dados (ex: Render Postgres).
